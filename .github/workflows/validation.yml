name: Scientific and browser validation
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install setuptools==84.2.1
      - run: python -m pip install . --no-build-isolation
      - name: Verify optional isolation and core science
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('pyscf') is None"
          python -m unittest discover -s tests -v
          python examples/sdk_basics.py
          python -m pip check
      - name: Verify standalone wheel
        run: |
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir /tmp/qal-wheel
          python scripts/verify_wheel.py /tmp/qal-wheel
  chemistry-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install setuptools==84.2.1
          .venv/bin/python -m pip install '.[computation]' --no-build-isolation
          .venv/bin/python -m unittest discover -s tests -v
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chrome
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
